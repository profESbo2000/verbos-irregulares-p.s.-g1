<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbos Irregulares - Grupo 1 (E -> IE)</title>
  <style>
    :root {
      --bg-color: #2b3a42;
      --box-bg: #3f51b5;
      --box-border: #303f9f;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --ie-color: #e53935;
      --stem-color: #facc15;
      --green-piece: #22c55e;
      --green-border: #15803d;
      --pronoun-color: #1565c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      padding: 20px;
      color: #ffffff;
    }

    .concept-header {
      background: linear-gradient(135deg, #ff5252, #ff793f);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto 25px auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .concept-title {
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .concept-rule {
      font-size: 1.2rem;
      margin-top: 8px;
      background: rgba(0,0,0,0.2);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
    }

    .concept-rule span {
      color: #fff176;
      font-weight: bold;
      text-decoration: underline;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .box-container {
      background-color: #1e293b;
      border: 4px solid #475569;
      border-radius: 20px;
      padding: 20px;
      min-height: 500px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .box-header {
      background-color: var(--box-bg);
      border: 2px solid var(--box-border);
      color: white;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .verbs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-content: flex-start;
    }

    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .card-container {
      width: 110px;
      height: 110px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 12px;
    }

    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-container.active .card-front,
    .card-container.active .card-back {
      border: 3px solid #ff5252;
      box-shadow: 0 0 12px rgba(255, 82, 82, 0.8);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .card-front {
      background-color: #ffffff;
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.9rem;
      border: 2px solid #cbd5e1;
    }

    .card-back {
      background-color: #f1f5f9;
      color: var(--text-main);
      transform: rotateY(180deg);
      border: 2px solid #cbd5e1;
      overflow: hidden;
    }

    .card-back-icon {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }

    .card-back-text {
      font-size: 0.75rem;
      font-weight: 800;
      color: #334155;
    }

    .select-btn {
      background-color: #ff793f;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .select-btn:hover {
      background-color: #ff5252;
    }

    .workspace {
      background-color: var(--card-bg);
      color: var(--text-main);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .workspace-header {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .selected-title {
      font-size: 2rem;
      font-weight: 900;
    }

    .conjugation-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      align-items: center;
      gap: 10px;
      background-color: #f8fafc;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .pronoun {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--pronoun-color);
    }

    .puzzle-box {
      cursor: pointer;
    }

    .puzzle-svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0px 3px 4px rgba(0, 0, 0, 0.12));
    }

    .text-stem {
      fill: #1f2937;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 17px;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .ie-highlight {
      fill: var(--ie-color);
      font-weight: 900;
    }

    .text-ending {
      fill: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 17px;
      dominant-baseline: central;
      text-anchor: middle;
      transition: opacity 0.25s ease;
    }

    .text-hidden {
      opacity: 0;
    }

    .audio-btn {
      background: #e2e8f0;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      background-color: #facc15;
      transform: scale(1.1);
    }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="concept-header">
    <div class="concept-title">GRUPO 1: VERBOS IRREGULARES</div>
    <div class="concept-rule">
      Cambio Vocálico: Cambia la <span>E</span> por <span>IE</span> en la raíz (excepto en Nosotros y Vosotros)
    </div>
  </div>

  <div class="main-layout">
    
    <div class="box-container">
      <div class="box-header">📦 CAJA DEL GRUPO 1 (Haz clic para girar)</div>
      <div class="verbs-grid" id="boxVerbs"></div>
    </div>

    <div class="workspace">
      <div class="workspace-header">
        <div class="selected-title" id="selectedVerbTitle">PENSAR</div>
      </div>

      <div class="conjugation-grid" id="conjugationGrid"></div>
    </div>

  </div>

  <script>
    const verbosGrupo1 = [
      { verbo: "PENSAR", tipo: "AR", raizBase: "pens", prefijo: "p", e_pos: "e", sufijo: "ns", icono: "🧠" },
      { verbo: "CERRAR", tipo: "AR", raizBase: "cerr", prefijo: "c", e_pos: "e", sufijo: "rr", icono: "🚪" },
      { verbo: "COMENZAR", tipo: "AR", raizBase: "comenz", prefijo: "com", e_pos: "e", sufijo: "nz", icono: "🏁" },
      { verbo: "EMPEZAR", tipo: "AR", raizBase: "empez", prefijo: "emp", e_pos: "e", sufijo: "z", icono: "🚀" },
      { verbo: "ENTENDER", tipo: "ER", raizBase: "entend", prefijo: "ent", e_pos: "e", sufijo: "nd", icono: "💡" },
      { verbo: "QUERER", tipo: "ER", raizBase: "quer", prefijo: "qu", e_pos: "e", sufijo: "r", icono: "❤️" },
      { verbo: "PERDER", tipo: "ER", raizBase: "perd", prefijo: "p", e_pos: "e", sufijo: "rd", icono: "🔍" },
      { verbo: "PREFERIR", tipo: "IR", raizBase: "prefer", prefijo: "pref", e_pos: "e", sufijo: "r", icono: "⭐" },
      { verbo: "SENTIR", tipo: "IR", raizBase: "sent", prefijo: "s", e_pos: "e", sufijo: "nt", icono: "🎭" },
      { verbo: "MENTIR", tipo: "IR", raizBase: "ment", prefijo: "m", e_pos: "e", sufijo: "nt", icono: "🤥" },
      { verbo: "DESPERTAR", tipo: "AR", raizBase: "despert", prefijo: "desp", e_pos: "e", sufijo: "rt", icono: "⏰" }
    ];

    const pronombres = ["Yo", "Tú", "Él / Ella / Usted", "Nosotros/as", "Vosotros/as", "Ellos / Ellas / Ustedes"];

    const terminaciones = {
      AR: ["-o", "-as", "-a", "-amos", "-áis", "-an"],
      ER: ["-o", "-es", "-e", "-emos", "-éis", "-en"],
      IR: ["-o", "-es", "-e", "-imos", "-ís", "-en"]
    };

    let selectedVerb = verbosGrupo1[0];

    function renderBox() {
      const box = document.getElementById('boxVerbs');
      box.innerHTML = '';

      verbosGrupo1.forEach((v) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';

        const container = document.createElement('div');
        container.className = 'card-container' + (v.verbo === selectedVerb.verbo ? ' active' : '');

        container.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <span>${v.verbo}</span>
            </div>
            <div class="card-back">
              <span class="card-back-icon">${v.icono}</span>
              <span class="card-back-text">${v.verbo}</span>
            </div>
          </div>
        `;

        container.onclick = () => {
          container.classList.toggle('flipped');
        };

        const selectBtn = document.createElement('button');
        selectBtn.className = 'select-btn';
        selectBtn.textContent = 'Conjugar';
        selectBtn.onclick = (e) => {
          e.stopPropagation();
          selectedVerb = v;
          renderBox();
          updateConjugation();
        };

        wrapper.appendChild(container);
        wrapper.appendChild(selectBtn);
        box.appendChild(wrapper);
      });
    }

    function updateConjugation() {
      document.getElementById('selectedVerbTitle').textContent = `${selectedVerb.verbo} (-${selectedVerb.tipo})`;

      const grid = document.getElementById('conjugationGrid');
      grid.innerHTML = '';

      pronombres.forEach((pronombre, i) => {
        const isNosotrosOrVosotros = (i === 3 || i === 4);
        const ending = terminaciones[selectedVerb.tipo][i];

        const raizCompleta = isNosotrosOrVosotros ? selectedVerb.raizBase : (selectedVerb.prefijo + "ie" + selectedVerb.sufijo);
        const fullWord = raizCompleta + ending.replace('-', '');

        const row = document.createElement('div');
        row.className = 'row';

        let raizSVGHtml = '';
        if (isNosotrosOrVosotros) {
          raizSVGHtml = `<tspan class="text-stem">${selectedVerb.raizBase}-</tspan>`;
        } else {
          raizSVGHtml = `<tspan class="text-stem">${selectedVerb.prefijo}</tspan>` +
                        `<tspan class="ie-highlight">ie</tspan>` +
                        `<tspan class="text-stem">${selectedVerb.sufijo}-</tspan>`;
        }

        row.innerHTML = `
          <div class="pronoun">${pronombre}</div>
          <div class="puzzle-box" onclick="togglePiece(${i})">
            <svg class="puzzle-svg" width="230" height="45" viewBox="0 0 230 45">
              <path d="M 5,4 L 110,4 
                       C 110,13 123,13 123,4 
                       L 130,4 
                       A 4,4 0 0,1 134,8 
                       L 134,16 
                       C 144,16 144,29 134,29 
                       L 134,38 
                       A 4,4 0 0,1 130,42 
                       L 5,42 
                       A 4,4 0 0,1 1,38 
                       L 1,8 
                       A 4,4 0 0,1 5,4 Z" 
                    fill="#facc15" stroke="#eab308" stroke-width="2"/>
              <text x="65" y="23" dominant-baseline="central" text-anchor="middle">${raizSVGHtml}</text>

              <path d="M 130,4 L 220,4 
                       A 4,4 0 0,1 224,8 
                       L 224,38 
                       A 4,4 0 0,1 220,42 
                       L 130,42 
                       A 4,4 0 0,1 126,38 
                       L 126,29 
                       C 136,29 136,16 126,16 
                       L 126,8 
                       A 4,4 0 0,1 130,4 Z" 
                    fill="#22c55e" stroke="#15803d" stroke-width="2"/>
              <text x="175" y="23" class="text-ending text-hidden" id="ending-${i}">${ending}</text>
            </svg>
          </div>
          <button class="audio-btn" title="Escuchar" onclick="speak('${pronombre} ${fullWord}')">🔊</button>
        `;
        grid.appendChild(row);
      });
    }

    function togglePiece(index) {
      const endingText = document.getElementById(`ending-${index}`);
      if(endingText) endingText.classList.toggle('text-hidden');
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    renderBox();
    updateConjugation();
  </script>

</body>
</html>
