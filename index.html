<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbos Irregulares - Grupo 1 (E -> IE)</title>
  <style>
    :root {
      --bg-color: #2b3a42;
      --box-bg: #3f51b5;
      --box-border: #303f9f;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --ie-color: #e53935;
      --stem-color: #facc15;
      --green-piece: #22c55e;
      --green-border: #15803d;
      --pronoun-color: #1565c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      padding: 20px;
      color: #ffffff;
    }

    .concept-header {
      background: linear-gradient(135deg, #ff5252, #ff793f);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto 25px auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .concept-title {
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .concept-rule {
      font-size: 1.2rem;
      margin-top: 8px;
      background: rgba(0,0,0,0.2);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
    }

    .concept-rule span {
      color: #fff176;
      font-weight: bold;
      text-decoration: underline;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .box-container {
      background-color: #1e293b;
      border: 4px solid #475569;
      border-radius: 20px;
      padding: 20px;
      min-height: 500px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .box-header {
      background-color: var(--box-bg);
      border: 2px solid var(--box-border);
      color: white;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .verbs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-content: flex-start;
    }

    /* TARJETAS CON GIRO POR CLIC (FLIPPED CLASS) */
    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .card-container {
      width: 110px;
      height: 110px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 12px;
    }

    /* Giro al hacer clic activado por JavaScript */
    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-container.active .card-front,
    .card-container.active .card-back {
      border: 3px solid #ff5252;
      box-shadow: 0 0 12px rgba(255, 82, 82, 0.8);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .card-front {
      background-color: #ffffff;
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.95rem;
      border: 2px solid #cbd5e1;
    }

    .card-back {
      background-color: #ffffff;
      transform: rotateY(180deg);
      border: 2px solid #cbd5e1;
      overflow: hidden;
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Botón para seleccionar el verbo */
    .select-btn {
      background-color: #ff793f;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .select-btn:hover {
      background-color: #ff5252;
    }

    .workspace {
      background-color: var(--card-bg);
      color: var(--text-main);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .workspace-header {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .selected-title {
      font-size: 2rem;
      font-weight: 900;
    }

    .conjugation-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      align-items: center;
      gap: 10px;
      background-color: #f8fafc;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .pronoun {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--pronoun-color);
    }

    .puzzle-box {
      cursor: pointer;
    }

    .puzzle-svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0px 3px 4px rgba(0, 0, 0, 0.12));
    }

    .text-stem {
      fill: #1f2937;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 17px;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .ie-highlight {
      fill: var(--ie-color);
      font-weight: 900;
    }

    .text-ending {
      fill: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 17px;
      dominant-baseline: central;
      text-anchor: middle;
      transition: opacity 0.25s ease;
    }

    .text-hidden {
      opacity: 0;
    }

    .audio-btn {
      background: #e2e8f0;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      background-color: #facc15;
      transform: scale(1.1);
    }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    <div class="concept-rule">

  </div>
